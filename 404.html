<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .notfound {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1rem;
        }
        .notfound .code {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(5rem, 18vw, 9rem);
            line-height: 1;
            color: var(--navy);
            letter-spacing: -.02em;
        }
        .notfound h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
        .notfound p { color: var(--muted); max-width: 42ch; margin: 0; }
        .notfound .home {
            margin-top: .6rem;
            font-family: var(--font-mono);
            font-size: .9rem;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
        }
        .notfound .home:hover { color: var(--fg); border-color: var(--fg); }
    </style>
</head>

<body>
    <nav>
        <div class="wrap nav-inner">
            <a href="/" class="brand">Alejandro <span>Ortiz</span></a>
            <div class="nav-links">
                <a href="/#about">About</a>
                <a href="/#academy">Academy</a>
                <a href="/#projects">Projects</a>
                <a href="/#beyond">Beyond</a>
            </div>
        </div>
    </nav>

    <main class="wrap notfound">
        <p class="eyebrow">Error</p>
        <div class="code">404</div>
        <h1>This isn't the page you're looking for</h1>
        <p>The page may have moved or never existed. Let's get you back on course.</p>
        <a class="home" href="/">Return to the home page &rarr;</a>
    </main>
</body>

</html>
